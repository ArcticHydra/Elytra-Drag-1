name: Build (update/mc1.21.8)

on:
  push:
    branches: ["update/mc1.21.8"]
  pull_request:
    branches: ["update/mc1.21.8"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: elytra-drag-jar
          path: build/libs/*.jar
